<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hill Climb Mini</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#101827;color:#fff;font-family:system-ui,Arial;overflow:hidden;touch-action:none}
  #wrap{height:100dvh;display:flex;flex-direction:column}
  header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#172338;font-weight:700}
  #stats{font-size:13px;font-weight:600;color:#dbeafe}
  canvas{display:block;width:100%;flex:1;min-height:0;background:linear-gradient(#72d4ff,#d8f6ff 65%,#b8e986 65%)}
  .controls{display:flex;gap:12px;padding:12px;background:#101827}
  button{flex:1;border:1px solid #60a5fa;border-radius:16px;padding:17px 8px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(180deg,#38bdf8 0%,#2563eb 100%);box-shadow:0 4px 0 #1e3a8a,0 0 12px #38bdf833;touch-action:none;transition:filter .12s,transform .08s}
  button:active{transform:translateY(3px);filter:brightness(1.12);box-shadow:0 1px 0 #1e3a8a}
  #brake{background:linear-gradient(180deg,#fb923c 0%,#ea580c 100%);border-color:#fdba74;box-shadow:0 4px 0 #9a3412,0 0 12px #fb923c33}
  #restart{flex:0.65;background:linear-gradient(180deg,#64748b 0%,#334155 100%);border-color:#94a3b8;box-shadow:0 4px 0 #1e293b;font-size:14px}
  #hint{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#0f172acc;padding:8px 12px;border-radius:12px;font-size:13px;white-space:nowrap}
  #shopBtn{position:absolute;right:10px;top:64px;z-index:3;border:1px solid #d8b4fe;border-radius:10px;padding:9px 12px;background:linear-gradient(135deg,#c084fc,#7c3aed 65%,#5b21b6);color:white;font-weight:800;font-size:13px;box-shadow:0 3px 0 #4c1d95,0 0 14px #a855f744}
  #shop{display:none;position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,390px);max-height:78dvh;overflow-y:auto;background:#111827f5;border:2px solid #64748b;border-radius:18px;padding:14px;box-shadow:0 10px 35px #0009;touch-action:pan-y}
  #shop h3{margin:0 38px 8px;text-align:center}
  #shop p{margin:4px 0 10px;text-align:center;font-size:13px;color:#cbd5e1}
  #closeShop{position:sticky;bottom:0;display:block;width:100%;background:linear-gradient(135deg,#64748b,#334155);border:1px solid #94a3b8;box-shadow:none;margin-top:8px}
  #closeShopX{position:absolute;top:8px;right:8px;width:38px;height:38px;min-width:38px;padding:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fb7185,#dc2626);border:1px solid #fda4af;box-shadow:0 3px 0 #881337,0 0 10px #fb718544;border-radius:50%;font-size:22px;z-index:2}
  .carOption{display:flex;align-items:center;gap:8px;width:100%;margin:7px 0;padding:10px;border:1px solid #475569;border-radius:10px;background:linear-gradient(110deg,#263449,#334155);color:white;box-shadow:inset 3px 0 0 #38bdf8;font-size:14px;text-align:left;flex:0 0 auto}
  .carOption:nth-child(3n+2){background:linear-gradient(110deg,#312e81,#4338ca);border-color:#6366f1;box-shadow:inset 3px 0 0 #a5b4fc}
  .carOption:nth-child(3n){background:linear-gradient(110deg,#064e3b,#047857);border-color:#10b981;box-shadow:inset 3px 0 0 #6ee7b7}
  .carOption:active{filter:brightness(1.18)}
  .carOption span{flex:1} #closeShop{background:linear-gradient(135deg,#64748b,#334155);box-shadow:none;margin-top:5px}
</style>
</head>
<body>
<div id="wrap">
<header><span>⛰️ Hill Climb Mini</span><span id="stats">Distance: 0 m · Points: 0</span></header>
<canvas id="game"></canvas>
<div id="hint">Driver ke saath ride • Points collect karo • GAS/BRAKE se stunt karo!</div>
<button id="shopBtn">🚗 CAR SHOP</button>
<div id="shop"><button id="closeShopX" aria-label="Close vehicle shop" title="Close">✕</button><h3>🚘 Vehicle Garage</h3><p>16 alag-alag vehicles! Har naya vehicle 1000 S points mein unlock karo.</p><div id="carOptions"></div><button id="closeShop">CLOSE SHOP</button></div>
<div class="controls">
  <button id="brake">◀ BRAKE</button>
  <button id="gas">GAS ▶</button>
  <button id="restart">↻<br>RESET</button>
</div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const stats=document.getElementById('stats'),hint=document.getElementById('hint');
let W=0,H=0,cam=0,carX=80,carY=0,vx=0,vy=0,angle=0,spin=0,airborne=false,coins=0,gameOver=false;
let gas=false,brake=false,worldCoins=[];
let audioCtx=null,engineOsc=null,engineGain=null;
const cars=[
 {name:'Starter Car',type:'car',icon:'🚗',color:'#1677ff',roof:'#38bdf8',cost:0},
 {name:'Sports Racer',type:'sports',icon:'🏎️',color:'#ef4444',roof:'#fca5a5',cost:1000},
 {name:'Off-Road Jeep',type:'jeep',icon:'🚙',color:'#16a34a',roof:'#86efac',cost:1000},
 {name:'Heavy Truck',type:'truck',icon:'🚚',color:'#eab308',roof:'#fde68a',cost:1000},
 {name:'Monster Truck',type:'monster',icon:'🛻',color:'#9333ea',roof:'#d8b4fe',cost:1000},
 {name:'Motorcycle',type:'bike',icon:'🏍️',color:'#f97316',roof:'#fed7aa',cost:1000},
 {name:'Monster Bike',type:'monsterbike',icon:'🏍️',color:'#db2777',roof:'#f9a8d4',cost:1000},
 {name:'Dirt Bike',type:'dirtbike',icon:'🏍️',color:'#0d9488',roof:'#99f6e4',cost:1000},
 {name:'Quad Bike',type:'quad',icon:'🛵',color:'#65a30d',roof:'#d9f99d',cost:1000},
 {name:'City Bus',type:'bus',icon:'🚌',color:'#0891b2',roof:'#a5f3fc',cost:1000},
 {name:'Tractor',type:'tractor',icon:'🚜',color:'#ca8a04',roof:'#fef08a',cost:1000},
 {name:'Pickup Truck',type:'pickup',icon:'🛻',color:'#64748b',roof:'#cbd5e1',cost:1000},
 {name:'Police Car',type:'police',icon:'🚓',color:'#1d4ed8',roof:'#dbeafe',cost:1000},
 {name:'Fire Engine',type:'fire',icon:'🚒',color:'#dc2626',roof:'#fecaca',cost:1000},
 {name:'Family Van',type:'van',icon:'🚐',color:'#7c3aed',roof:'#ddd6fe',cost:1000},
 {name:'Dune Buggy',type:'buggy',icon:'🏁',color:'#ea580c',roof:'#fdba74',cost:1000}
];
let unlocked=[0],selectedCar=0;
try{const saved=JSON.parse(localStorage.getItem('hillClimbGarage')||'{}');if(Array.isArray(saved.unlocked))unlocked=[...new Set([0,...saved.unlocked.filter(n=>Number.isInteger(n)&&n>=0&&n<cars.length)])];if(Number.isInteger(saved.selected)&&unlocked.includes(saved.selected))selectedCar=saved.selected;}catch(e){}
function saveGarage(){try{localStorage.setItem('hillClimbGarage',JSON.stringify({unlocked,selected:selectedCar}));}catch(e){}}
function getAudio(){audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function coinSound(){try{const a=getAudio(),t=a.currentTime;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1320,t+0.07);g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.22);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+0.23);}catch(e){}}
function engineStart(){try{const a=getAudio();if(engineOsc)return;engineOsc=a.createOscillator();engineGain=a.createGain();engineOsc.type='sawtooth';engineOsc.frequency.value=65;engineGain.gain.value=0.0001;engineOsc.connect(engineGain);engineGain.connect(a.destination);engineOsc.start();}catch(e){}}
function engineUpdate(){if(!engineOsc||!audioCtx)return;const active=gas&&!gameOver;engineGain.gain.setTargetAtTime(active?0.035:0.0001,audioCtx.currentTime,0.08);engineOsc.frequency.setTargetAtTime(55+Math.min(100,Math.abs(vx)*12)+(gas?25:0),audioCtx.currentTime,0.06);}
function engineStop(){if(engineGain&&audioCtx)engineGain.gain.setTargetAtTime(0.0001,audioCtx.currentTime,0.04);}
const groundY=()=>H*0.73;
function terrain(x){return groundY()-Math.sin(x*.012)*43-Math.sin(x*.027)*20-Math.sin(x*.004)*48-Math.sin(x*.043)*7;}
function resize(){const r=canvas.getBoundingClientRect();W=canvas.width=Math.max(320,Math.floor(r.width*devicePixelRatio));H=canvas.height=Math.max(260,Math.floor(r.height*devicePixelRatio));ctx.setTransform(1,0,0,1,0,0);ctx.scale(devicePixelRatio,devicePixelRatio);W=r.width;H=r.height;if(!carY)carY=terrain(carX)-8;}
window.addEventListener('resize',resize);
function reset(){cam=0;carX=80;vx=0;vy=0;angle=0;spin=0;airborne=false;coins=0;gameOver=false;carY=terrain(carX)-8;worldCoins=[];const pointValues=[100,200,250,100,500];let n=0;for(let x=300;x<20000;x+=230){worldCoins.push({x,y:terrain(x)-48,got:false,value:pointValues[n%pointValues.length]});n++;}hint.style.display='block';}
function drawWheel(x,y,r){ctx.fillStyle='#202733';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#090f18';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#cbd5e1';ctx.beginPath();ctx.arc(x,y,Math.max(3,r*.38),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#64748b';ctx.lineWidth=1.5;for(let i=0;i<4;i++){let a=i*Math.PI/2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*r*.28,y+Math.sin(a)*r*.28);ctx.stroke();}}
function drawVehicle(car){
 const c=car.color,r=car.roof;ctx.lineJoin='round';ctx.lineCap='round';
 const body=(x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
 const cab=(x,y,w,h)=>{ctx.fillStyle=r;ctx.fillRect(x,y,w,h);ctx.fillStyle='#bdeaff';ctx.fillRect(x+4,y+4,Math.max(5,w-8),Math.max(4,h-7));};
 const wheel=(x,y,size=9)=>drawWheel(x,y,size);
 if(car.type==='bike'||car.type==='dirtbike'||car.type==='monsterbike'){
   const big=car.type==='monsterbike'?13:8;wheel(-20,-3,big);wheel(21,-3,big);
   ctx.strokeStyle=c;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-20,-3);ctx.lineTo(-5,-17);ctx.lineTo(9,-4);ctx.lineTo(21,-3);ctx.moveTo(-5,-17);ctx.lineTo(2,-4);ctx.stroke();
   ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(-9,-20);ctx.lineTo(5,-23);ctx.lineTo(13,-13);ctx.lineTo(1,-10);ctx.closePath();ctx.fill();
   ctx.strokeStyle='#dbeafe';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(12,-12);ctx.lineTo(17,-23);ctx.lineTo(24,-23);ctx.stroke();
   ctx.fillStyle=r;ctx.beginPath();ctx.ellipse(-1,-25,7,5,-.2,0,Math.PI*2);ctx.fill();
   if(car.type==='monsterbike'){wheel(-20,-3,15);wheel(21,-3,15);}
 } else if(car.type==='truck'||car.type==='fire'||car.type==='pickup'){
   wheel(-22,-2,car.type==='truck'?11:9);wheel(23,-2,car.type==='truck'?11:9);
   body(-34,-22,car.type==='pickup'?38:42,18);body(8,-32,26,28);cab(11,-29,19,14);
   if(car.type==='pickup'){body(-31,-32,22,10);ctx.strokeStyle=r;ctx.lineWidth=2;ctx.strokeRect(-31,-32,22,10);}
   if(car.type==='fire'){body(-30,-29,28,8);ctx.fillStyle='#f8fafc';ctx.fillRect(-18,-27,4,4);ctx.fillRect(-8,-27,4,4);ctx.fillStyle='#facc15';ctx.fillRect(-2,-36,14,3);}
   if(car.type==='truck'){body(-29,-28,29,5);ctx.fillStyle='#f8fafc';ctx.fillRect(-25,-26,4,2);ctx.fillRect(-15,-26,4,2);}
 } else if(car.type==='monster'){
   wheel(-22,-2,17);wheel(23,-2,17);body(-34,-26,65,20);cab(-13,-39,29,15);ctx.fillStyle=r;ctx.fillRect(-32,-30,62,4);ctx.fillStyle='#fef08a';ctx.fillRect(22,-22,7,5);
 } else if(car.type==='bus'||car.type==='van'){
   wheel(-22,-2,9);wheel(23,-2,9);body(-34,-31,67,28);cab(-28,-27,car.type==='bus'?54:49,14);
   if(car.type==='bus'){ctx.fillStyle='#f8fafc';ctx.fillRect(-30,-6,58,3);for(let x=-23;x<25;x+=12){ctx.fillStyle='#164e63';ctx.fillRect(x,-24,8,9);}}
   else {ctx.fillStyle='#5b21b6';ctx.fillRect(-29,-10,54,3);}
 } else if(car.type==='tractor'){
   wheel(-23,-1,15);wheel(22,-2,8);body(-31,-21,38,14);body(2,-29,14,22);cab(4,-39,10,10);ctx.fillStyle=r;ctx.fillRect(4,-38,9,8);ctx.fillStyle='#374151';ctx.fillRect(-12,-32,4,12);
 } else if(car.type==='quad'){
   wheel(-23,-2,7);wheel(-7,-2,7);wheel(12,-2,7);wheel(26,-2,7);body(-30,-18,57,11);body(-12,-25,22,8);ctx.fillStyle=r;ctx.fillRect(-8,-27,16,5);ctx.strokeStyle='#e2e8f0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-23,-17);ctx.lineTo(-28,-24);ctx.moveTo(23,-17);ctx.lineTo(28,-24);ctx.stroke();
 } else if(car.type==='police'){
   wheel(-21,-2,9);wheel(21,-2,9);body(-32,-22,64,16);cab(-12,-34,27,13);ctx.fillStyle='#f8fafc';ctx.fillRect(-8,-21,15,5);ctx.fillStyle='#ef4444';ctx.fillRect(-5,-38,8,4);ctx.fillStyle='#38bdf8';ctx.fillRect(3,-38,8,4);ctx.fillStyle='#f8fafc';ctx.fillRect(25,-18,6,5);
 } else if(car.type==='sports'||car.type==='buggy'){
   wheel(-21,-2,car.type==='buggy'?8:9);wheel(22,-2,car.type==='buggy'?8:9);body(-33,-20,65,14);
   ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(-17,-20);ctx.lineTo(-8,-32);ctx.lineTo(12,-31);ctx.lineTo(23,-20);ctx.closePath();ctx.fill();cab(-7,-30,16,8);
   if(car.type==='buggy'){ctx.strokeStyle=r;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-15,-31);ctx.lineTo(-10,-42);ctx.lineTo(14,-42);ctx.lineTo(20,-29);ctx.stroke();ctx.fillStyle='#facc15';ctx.fillRect(26,-18,5,4);}
 } else { // standard car and jeep
   const jeep=car.type==='jeep';wheel(-21,-2,jeep?11:9);wheel(21,-2,jeep?11:9);body(-32,jeep?-23:-21,64,16);
   if(jeep){body(-20,-35,39,13);cab(-16,-33,30,9);ctx.fillStyle='#374151';ctx.fillRect(-28,-37,5,15);ctx.fillRect(22,-37,5,15);ctx.fillStyle='#facc15';ctx.fillRect(27,-18,5,5);}
   else {ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(-17,-21);ctx.lineTo(-8,-34);ctx.lineTo(12,-34);ctx.lineTo(23,-21);ctx.closePath();ctx.fill();cab(-7,-32,17,9);}
 }
 // headlights and bumper give each vehicle a finished look
 ctx.fillStyle='#fff7b2';ctx.fillRect(27,-18,4,4);ctx.fillStyle='#e2e8f0';ctx.fillRect(-34,-7,7,3);
}
function draw(){
 const dpr=devicePixelRatio||1;ctx.clearRect(0,0,W,H);
 // sun and clouds
 ctx.fillStyle='#fff7b2';ctx.beginPath();ctx.arc(W-48,48,20,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#ffffffaa';for(let i=0;i<3;i++){let x=((i*190-cam*.15)%(W+100)+W+100)%(W+100)-30;ctx.beginPath();ctx.arc(x,65+i%2*24,18,0,Math.PI*2);ctx.arc(x+22,58+i%2*24,23,0,Math.PI*2);ctx.arc(x+45,67+i%2*24,16,0,Math.PI*2);ctx.fill();}
 // hills
 ctx.beginPath();ctx.moveTo(0,H);for(let sx=0;sx<=W+5;sx+=5)ctx.lineTo(sx,terrain(sx+cam));ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle='#55a84f';ctx.fill();
 ctx.beginPath();for(let sx=0;sx<=W+5;sx+=5){let y=terrain(sx+cam);if(sx===0)ctx.moveTo(sx,y);else ctx.lineTo(sx,y);}ctx.strokeStyle='#2c7135';ctx.lineWidth=4;ctx.stroke();
 // Gold point coins: 100, 200, 250, 100, 500
 for(const c of worldCoins){if(c.got)continue;let x=c.x-cam;if(x>-35&&x<W+35){ctx.fillStyle='#ffd43b';ctx.beginPath();ctx.arc(x,c.y,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d18b00';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#8a4b08';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 7px system-ui';ctx.fillText(String(c.value),x,c.y);}}
 // Draw each vehicle with a distinct silhouette and wheel size
 const screenX=carX-cam, screenY=carY, car=cars[selectedCar]||cars[0];
 ctx.save();ctx.translate(screenX,screenY);ctx.rotate(angle);drawVehicle(car);ctx.restore();
 // game over
 if(gameOver){ctx.fillStyle='#0f172acc';ctx.fillRect(W/2-125,H/2-45,250,90);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 22px system-ui';ctx.fillText('Oops! Car flipped!',W/2,H/2-7);ctx.font='14px system-ui';ctx.fillText('RESET dabakar phir se khelo',W/2,H/2+20);}
 stats.textContent=`Distance: ${Math.max(0,Math.floor(carX/10))} m · Points: ${coins}`;
 engineUpdate();
}
function renderShop(){
 const box=document.getElementById('carOptions');box.innerHTML='';
 cars.forEach((car,i)=>{const b=document.createElement('button');b.className='carOption';const owned=unlocked.includes(i),selected=selectedCar===i;
 b.innerHTML=`${car.icon} <span><b>${car.name}</b><br>${selected?'Selected':owned?'Unlocked':'Price: '+car.cost+' S coins'}</span><b>${selected?'✓':owned?'USE':'BUY'}</b>`;
 b.addEventListener('click',()=>{if(owned){selectedCar=i;saveGarage();renderShop();return;}if(coins>=car.cost){coins-=car.cost;unlocked.push(i);selectedCar=i;saveGarage();renderShop();}else{hint.textContent=`Aur ${car.cost-coins} S coins chahiye!`;hint.style.display='block';}});box.appendChild(b);});
}
function loop(){
 if(!gameOver){
   if(gas)vx+=0.16; if(brake)vx-=0.19;
   vx=Math.max(-2.8,Math.min(6.4,vx));vx*=.994;
   const oldX=carX; carX+=vx;let gy=terrain(carX)-8;
   let slope=(terrain(carX+9)-terrain(carX-9))/18;
   // Gravity, bumps and a little suspension: fast bumps can launch the car
   if(!airborne && Math.abs(vx)>3.0 && terrain(oldX)-terrain(carX+12)>15){airborne=true;vy=-3.0;spin=0;}
   if(airborne){
     vy+=0.24;carY+=vy;
     // Gas and brake rotate the car while airborne, like a stunt game
     if(gas)spin+=0.012; if(brake)spin-=0.014;
     spin*=0.997;angle+=spin;
     if(carY>=gy && vy>0){carY=gy;vy=0;airborne=false;spin*=0.35;const wrapped=Math.atan2(Math.sin(angle),Math.cos(angle));if(Math.abs(wrapped)<1.05){angle=Math.atan(slope)*0.65;}else{angle=wrapped;}}
   } else {
     carY=gy;vy=0;
     const target=Math.atan(slope);
     angle+=(target-angle)*0.18;
     if(Math.abs(vx)>4.2 && Math.abs(slope)>0.48){airborne=true;vy=-1.8;spin+=(gas?0.025:-0.018);}
   }
   for(const c of worldCoins){if(!c.got&&Math.abs(c.x-carX)<24&&Math.abs(c.y-(carY-15))<35){c.got=true;coins+=c.value;coinSound();}}
   cam=Math.max(0,carX-W*.32);
   const uprightAngle=Math.atan2(Math.sin(angle),Math.cos(angle));
   if(Math.abs(uprightAngle)>2.35&&carX>120){gameOver=true;hint.style.display='none';}
   if(carX<0)carX=0;
 }
 draw();requestAnimationFrame(loop);
}
function bind(id,setter){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();if(id==='gas')engineStart();setter(true);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{setter(false);if(id==='gas')engineStop();}));}
bind('gas',v=>gas=v);bind('brake',v=>brake=v);
document.getElementById('restart').addEventListener('click',reset);
document.getElementById('shopBtn').addEventListener('click',()=>{renderShop();document.getElementById('shop').style.display='block';hint.style.display='none';});
function closeShop(){document.getElementById('shop').style.display='none';}
document.getElementById('closeShop').addEventListener('click',closeShop);
document.getElementById('closeShopX').addEventListener('click',closeShop);
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')gas=true;if(e.key==='ArrowLeft')brake=true;});
window.addEventListener('keyup',e=>{if(e.key==='ArrowRight'||e.key===' ')gas=false;if(e.key==='ArrowLeft')brake=false;});
renderShop();resize();reset();loop();
</script>
</body>
</html>
